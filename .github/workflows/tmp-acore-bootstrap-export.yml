name: Temporary AzerothCore transport probe

on:
  push:
    branches:
      - 'tmp/acore-bootstrap-20260928'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Upload harmless text probe
        run: |
          set -euo pipefail
          printf 'azerothcore-external-transport-probe\n' > probe.txt
          echo "PROBE_URL=$(curl -fsS -F 'file=@probe.txt' https://0x0.st)"
